name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # write commits reveal-sync's state straight to main (docs/plans/P3-pipelines.md, P3-6).
    # A push that changes only that file needs neither a CI run nor a deploy.
    paths-ignore: ['scripts/reveal-sync/state.json']

# Nothing here writes to GitHub, and checkout authenticates with APP_REPO_TOKEN,
# so the workflow's own GITHUB_TOKEN only needs to read.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # APP_REPO_TOKEN (read-only on both repos) fetches the private submodule.
      # Dependabot-triggered runs read Dependabot secrets, so the same token is
      # stored there too (Task 1.11).
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.APP_REPO_TOKEN }}
          # Submodules are fetched inside this step; don't leave the token in
          # .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      # Third-party action pinned to a commit; bump the SHA and comment together.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm lint
      # A push to main collects coverage for CodeScene's coverage views (#97). A PR collects
      # none: nothing reads it there, and it makes the suite about a minute slower.
      - run: pnpm test:run ${{ github.event_name == 'push' && '--coverage' || '' }}
      # Line and branch coverage for the commit CodeScene's next analysis reads, uploaded from
      # the repo root, as cs-coverage requires. A CodeScene outage must not turn main red, so
      # failures only warn, and the step skips until the owner sets CODESCENE_COVERAGE_TOKEN.
      - name: Upload coverage to CodeScene
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CODESCENE_COVERAGE_TOKEN }}
          CS_COVERAGE_VERSION: 1.0.40
        run: |
          if [ -z "$CS_ACCESS_TOKEN" ]; then
            echo "::notice::CODESCENE_COVERAGE_TOKEN is not set; skipping the coverage upload."
            exit 0
          fi
          curl -fsSL https://downloads.codescene.io/enterprise/cli/install-cs-coverage-tool.sh | sh -s -- -y "$CS_COVERAGE_VERSION"
          export PATH="$HOME/.local/bin:$PATH"
          for metric in line-coverage branch-coverage; do
            cs-coverage upload --format lcov --metric "$metric" coverage/lcov.info \
              || echo "::warning::CodeScene coverage upload failed ($metric)"
          done
      # The Claude hook case table. Every case starts bash, which takes minutes on
      # Windows, so it runs here rather than in the pre-commit hook.
      - run: pnpm check:hooks
      - run: pnpm build

  # The app's audit step (Doberjohn/inkweave#490). pnpm 11 queries npm's bulk advisory
  # endpoint; the pinned pnpm 10 still queries the legacy one, which npm is retiring.
  # --pm-on-fail=ignore stops pnpm 11 from handing the command to the packageManager pin.
  # Audits dev and prod dependencies and fails on high or critical. It reads only
  # pnpm-lock.yaml, so it needs neither the submodule nor an install. To waive an accepted
  # advisory, add its GHSA id under auditConfig.ignoreGhsas in pnpm-workspace.yaml (where
  # pnpm 11's `audit --ignore` writes it), with the reason.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party action pinned to a commit; bump the SHA and comment together.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - run: pnpm dlx pnpm@11.28.2 audit --pm-on-fail=ignore --audit-level high
