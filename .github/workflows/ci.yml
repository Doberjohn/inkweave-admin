name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # write commits reveal-sync's state straight to main (docs/plans/P3-pipelines.md, P3-6).
    # A push that changes only that file needs neither a CI run nor a deploy.
    paths-ignore: ['scripts/reveal-sync/state.json']

# Nothing here writes to GitHub, and checkout authenticates with APP_REPO_TOKEN,
# so the workflow's own GITHUB_TOKEN only needs to read.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      # APP_REPO_TOKEN (read-only on both repos) fetches the private submodule.
      # Dependabot-triggered runs read Dependabot secrets, so the same token is
      # stored there too (Task 1.11).
      - uses: actions/checkout@v7
        with:
          submodules: true
          token: ${{ secrets.APP_REPO_TOKEN }}
          # Submodules are fetched inside this step; don't leave the token in
          # .git/config for later steps (dependency install scripts included).
          persist-credentials: false

      # Third-party action pinned to a commit; bump the SHA and comment together.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:run
      # The Claude hook case table. Every case starts bash, which takes minutes on
      # Windows, so it runs here rather than in the pre-commit hook.
      - run: pnpm check:hooks
      - run: pnpm build

  # The app's audit step (Doberjohn/inkweave#490). pnpm 11 queries npm's bulk advisory
  # endpoint; the pinned pnpm 9 still queries the legacy one, which npm is retiring.
  # --pm-on-fail=ignore stops pnpm 11 from handing the command to the packageManager pin.
  # Audits dev and prod dependencies and fails on high or critical. It reads only
  # pnpm-lock.yaml, so it needs neither the submodule nor an install. To waive an accepted
  # advisory, add its GHSA id under audit.ignore in pnpm-workspace.yaml, with the reason.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party action pinned to a commit; bump the SHA and comment together.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - run: pnpm dlx pnpm@11.28.2 audit --pm-on-fail=ignore --audit-level high
